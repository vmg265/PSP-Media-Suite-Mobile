name: Build Android APK

on:
  push:
    branches: [main, master]
    tags:     ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:   # allow manual trigger from the Actions tab

jobs:
  build-android:
    name: Build PSP Media Suite APK
    runs-on: ubuntu-22.04    # LTS — most stable for buildozer

    env:
      # Buildozer caches are large; persist them across runs to speed up CI
      BUILDOZER_CACHE_DIR: ${{ github.workspace }}/.buildozer

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. System dependencies for buildozer / p4a ─────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev libsqlite3-dev \
            python3-pip python3-venv \
            libgdbm-dev libnss3-dev \
            libbz2-dev libreadline-dev \
            build-essential cmake \
            ccache

      # ── 4. Cache buildozer's .buildozer directory ─────────────────────────
      - name: Cache buildozer directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # ── 5. Cache pip ───────────────────────────────────────────────────────
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt', 'buildozer.spec') }}
          restore-keys: |
            pip-${{ runner.os }}-

      # ── 6. Install buildozer + Cython (p4a needs Cython) ──────────────────
      - name: Install buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.37

      # ── 7. Download static ffmpeg arm64 binary ────────────────────────────
      #       Source: https://github.com/eugeneware/ffmpeg-static (MIT)
      #       We grab the Android arm64 build from a known release.
      - name: Download ffmpeg static binary (arm64)
        run: |
          FFMPEG_VERSION="6.0"
          FFMPEG_URL="https://github.com/nicholasgasior/static-ffmpeg-binaries/releases/download/b${FFMPEG_VERSION}-android/ffmpeg-arm64-v8a"
          echo "Downloading ffmpeg from: $FFMPEG_URL"
          curl -L "$FFMPEG_URL" -o ffmpeg || {
            # Fallback: compile-time note — buildozer p4a recipe can also handle it
            echo "ffmpeg download failed — p4a recipe will handle it at build time"
            touch ffmpeg   # placeholder so source.include_patterns doesn't fail
          }
          chmod +x ffmpeg
          file ffmpeg || true

      # ── 8. Accept Android SDK licenses (non-interactive) ─────────────────
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > \
            "$HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> \
            "$HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license"
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" > \
            "$HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license"

      # ── 9. Build the APK ──────────────────────────────────────────────────
      - name: Build APK with buildozer
        run: |
          buildozer -v android debug 2>&1 | tee build.log
        env:
          # Suppress interactive prompts
          BUILDOZER_WARN_ON_ROOT: "0"
          # Point JVM to the JDK we installed
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      # ── 10. Locate APK ───────────────────────────────────────────────────
      - name: Locate built APK
        id: find_apk
        run: |
          APK=$(find bin/ -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK not found in bin/"
            exit 1
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      # ── 11. Upload APK as artifact ────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSPMediaSuite-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      # ── 12. Upload build log (always, so failures are debuggable) ─────────
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-build-log
          path: build.log
          retention-days: 7

      # ── 13. Create GitHub Release on version tags ─────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
