name: Build Android APK

on:
  push:
    branches: [main, master]
    tags:     ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build PSP Media Suite APK
    runs-on: ubuntu-22.04

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. System dependencies ────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev libsqlite3-dev \
            python3-pip python3-venv \
            libgdbm-dev libnss3-dev \
            libbz2-dev libreadline-dev \
            build-essential cmake \
            ccache

      # ── 4. Install Android SDK + compatibility shim ───────────────────────
      #
      #   ROOT CAUSE (persistent across both previous runs):
      #   Buildozer 1.5 hardcodes the sdkmanager path as:
      #     .buildozer/android/platform/android-sdk/tools/bin/sdkmanager
      #   But Google's current cmdline-tools zip installs it at:
      #     .buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager
      #   Buildozer sees an empty "android-sdk" dir (we set ANDROID_SDK_ROOT),
      #   finds the SDK root, then immediately fails because "tools/bin/sdkmanager"
      #   doesn't exist at the old pre-2019 path.
      #
      #   Fix: install cmdline-tools at the new path, then create a symlink
      #   tree at the old "tools/bin/" path so buildozer's hardcoded check passes.
      - name: Install Android SDK + shim for buildozer's old sdkmanager path
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          # ── Install cmdline-tools at the modern path ──────────────────────
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          CMDTOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          curl -fsSL --max-time 120 "$CMDTOOLS_URL" -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          # Google zips as "cmdline-tools/", sdkmanager needs it at .../latest/
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
             "$ANDROID_SDK_ROOT/cmdline-tools/latest" 2>/dev/null || true
          rm cmdline-tools.zip

          REAL_SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "sdkmanager version: $("$REAL_SDKMANAGER" --version)"

          # ── Shim: buildozer 1.5 looks for tools/bin/sdkmanager ───────────
          # Create the legacy directory tree and symlink every binary there.
          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"
          ln -sf "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"  \
                 "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          ln -sf "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"  \
                 "$ANDROID_SDK_ROOT/tools/bin/avdmanager" 2>/dev/null || true
          echo "Shim created: $(ls -la $ANDROID_SDK_ROOT/tools/bin/)"

          # ── Accept licenses ───────────────────────────────────────────────
          yes | "$REAL_SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # ── Pre-install SDK components buildozer needs ────────────────────
          "$REAL_SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          # ── Export env vars ───────────────────────────────────────────────
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"     >> $GITHUB_ENV

      # ── 5. Cache .buildozer directory ─────────────────────────────────────
      - name: Cache buildozer directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # ── 6. Cache pip ───────────────────────────────────────────────────────
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            pip-${{ runner.os }}-

      # ── 7. Install buildozer + Cython ─────────────────────────────────────
      - name: Install buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==0.29.37"

      # ── 8. Download static ffmpeg arm64 binary ────────────────────────────
      - name: Download ffmpeg static binary (arm64)
        run: |
          # BtbN's static arm64 GPL build — verified 157 MB ELF in previous run
          FFMPEG_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linuxarm64-gpl.tar.xz"

          echo "Downloading ffmpeg from BtbN..."
          curl -fsSL --max-time 120 "$FFMPEG_URL" -o ffmpeg.tar.xz

          SIZE=$(stat -c%s ffmpeg.tar.xz 2>/dev/null || echo 0)
          if [ "$SIZE" -gt 100000 ]; then
            tar -xf ffmpeg.tar.xz --strip-components=2 --wildcards "*/bin/ffmpeg"
            rm -f ffmpeg.tar.xz
            echo "Extracted: $(ls -lh ffmpeg)"
          else
            echo "Download failed ($SIZE bytes) — using empty placeholder"
            touch ffmpeg
          fi

          chmod +x ffmpeg
          file ffmpeg || true

      # ── 9. Accept Android SDK licenses (belt-and-suspenders) ─────────────
      - name: Accept Android SDK licenses
        run: |
          LICENSES_DIR="$HOME/.buildozer/android/platform/android-sdk/licenses"
          mkdir -p "$LICENSES_DIR"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" \
            > "$LICENSES_DIR/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" \
            >> "$LICENSES_DIR/android-sdk-license"
          printf "d975f751698a77b662f1254ddbeed3901e976f5a\n" \
            > "$LICENSES_DIR/android-sdk-preview-license"

      # ── 10. Build the APK ──────────────────────────────────────────────────
      - name: Build APK with buildozer
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROIDSDK: ${{ env.ANDROID_SDK_ROOT }}
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          buildozer -v android debug 2>&1 | tee build.log

      # ── 11. Locate APK ─────────────────────────────────────────────────────
      - name: Locate built APK
        id: find_apk
        run: |
          APK=$(find bin/ -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK not found in bin/"
            echo "--- Last 100 lines of build log ---"
            tail -100 build.log || true
            exit 1
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"
          ls -lh "$APK"

      # ── 12. Upload APK ─────────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSPMediaSuite-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      # ── 13. Upload build log (always) ──────────────────────────────────────
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-build-log
          path: build.log
          retention-days: 7

      # ── 14. GitHub Release on version tags ─────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
